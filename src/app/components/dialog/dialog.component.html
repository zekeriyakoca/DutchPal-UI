<dialog #el (close)="dialog.close()" (click)="$event.target === $event.currentTarget && dialog.close()"
  class="w-[min(28rem,calc(100%-2rem))] rounded-card border border-line bg-white p-0 text-ink shadow-xl backdrop:bg-ink/40 backdrop:backdrop-blur-sm"
  aria-labelledby="dialog-title">
  @if (dialog.current(); as state) {
  <div class="flex gap-4 p-6">
    <span class="flex size-10 shrink-0 items-center justify-center rounded-full"
      [class]="state.kind === 'error' ? 'bg-danger-50 text-danger-700' : 'bg-primary-50 text-primary-700'" aria-hidden="true">
      <svg class="size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        @if (state.kind === 'error') {
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        } @else {
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
        }
      </svg>
    </span>
    <div class="min-w-0">
      <h2 id="dialog-title" class="font-display text-base font-semibold">{{ state.title }}</h2>
      <p class="mt-1 text-sm text-ink-muted">{{ state.message }}</p>
    </div>
  </div>
  <div class="flex justify-end gap-2 border-t border-line bg-canvas px-6 py-3">
    <button type="button" class="btn-secondary" (click)="dialog.close()">
      {{ state.kind === 'confirm' ? 'Cancel' : 'Close' }}
    </button>
    @if (state.kind === 'confirm' || state.retry) {
    <button type="button" class="btn-primary" (click)="dialog.close(true)" autofocus>{{ state.confirmLabel }}</button>
    }
  </div>
  }
</dialog>
