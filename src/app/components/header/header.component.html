<header class="border-b border-line bg-white/90 backdrop-blur supports-[backdrop-filter]:bg-white/75">
  <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-6 px-4 sm:px-6 lg:px-8"
    aria-label="Global">
    <a routerLink="/" class="-m-1.5 flex shrink-0 items-center rounded-control p-1.5">
      <span class="sr-only">DutchPal home</span>
      <img class="h-10 w-auto" src="assets/logo.svg" alt="" />
    </a>

    <div class="hidden items-center gap-1 lg:flex">
      @for (link of links; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="!bg-primary-50 !text-primary-700" ariaCurrentWhenActive="page"
        class="rounded-control px-3.5 py-2 text-sm font-medium text-ink-muted transition-colors hover:bg-canvas hover:text-ink">{{
        link.label }}</a>
      }
    </div>

    <div class="hidden lg:flex lg:w-32 lg:justify-end">
      <a href="#" class="rounded-control px-3 py-2 text-sm font-semibold text-ink-muted hover:text-ink">Log in <span
          aria-hidden="true">&rarr;</span></a>
    </div>

    <button type="button"
      class="-mr-2 inline-flex items-center justify-center rounded-control p-2.5 text-ink hover:bg-canvas lg:hidden"
      [attr.aria-expanded]="isMobileMenuOpen()" aria-controls="mobile-menu"
      (click)="isMobileMenuOpen.set(!isMobileMenuOpen())">
      <span class="sr-only">{{ isMobileMenuOpen() ? 'Close' : 'Open' }} main menu</span>
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        @if (isMobileMenuOpen()) {
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        } @else {
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        }
      </svg>
    </button>
  </nav>

  @if (isMobileMenuOpen()) {
  <div id="mobile-menu" class="border-t border-line bg-white px-4 pb-4 pt-2 shadow-pop lg:hidden"
    (keydown.escape)="isMobileMenuOpen.set(false)">
    @for (link of links; track link.path) {
    <a [routerLink]="link.path" routerLinkActive="!bg-primary-50 !text-primary-700" ariaCurrentWhenActive="page"
      (click)="isMobileMenuOpen.set(false)"
      class="block rounded-control px-3 py-2.5 text-base font-medium text-ink hover:bg-canvas">{{ link.label }}</a>
    }
    <div class="mt-2 border-t border-line pt-2">
      <a href="#" class="block rounded-control px-3 py-2.5 text-base font-medium text-ink-muted hover:bg-canvas">Log
        in</a>
    </div>
  </div>
  }
</header>
