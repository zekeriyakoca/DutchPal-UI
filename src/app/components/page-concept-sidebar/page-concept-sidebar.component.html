<div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
  @if (title()) {
  <div class="mb-6">
    <h1 class="text-2xl font-semibold tracking-tight text-ink sm:text-3xl">{{ title() }}</h1>
    @if (subtitle()) {
    <p class="mt-1 text-ink-muted">{{ subtitle() }}</p>
    }
  </div>
  }

  <div class="flex flex-col items-start gap-6" [class.lg:flex-row]="isMenuOpen()">
    <aside class="card w-full shrink-0 lg:sticky lg:top-24" [class.lg:w-72]="isMenuOpen()">
      <button type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()" aria-controls="page-controls"
        class="flex w-full items-center justify-between gap-3 rounded-card px-5 py-4 text-left text-sm font-semibold text-ink hover:bg-canvas/60">
        <span class="flex items-center gap-2">
          <svg class="size-5 text-primary-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke-width="1.6" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
          </svg>
          {{ isMenuOpen() ? 'Options' : 'Show options' }}
        </span>
        <svg class="size-4 text-ink-subtle transition-transform" [class.rotate-180]="isMenuOpen()"
          xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </button>
      <div id="page-controls" class="border-t border-line px-5 pb-5 pt-4" [class.hidden]="!isMenuOpen()">
        <ng-content select="sidebar-menu"></ng-content>
      </div>
    </aside>

    <section class="card min-h-[60vh] w-full min-w-0 flex-1 p-5 sm:p-8">
      <ng-content select="master-content"></ng-content>
    </section>
  </div>
</div>
