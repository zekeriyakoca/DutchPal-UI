<ul class="space-y-3">
  @for (integration of integrations; track integration.path) {
  <li>
    <a [routerLink]="integration.path" class="card flex items-center gap-4 p-4 transition-colors hover:border-primary-200 sm:p-5">
      <span class="flex size-10 shrink-0 items-center justify-center rounded-control border border-line bg-canvas font-semibold text-ink"
        aria-hidden="true">{{ integration.mark }}</span>
      <span class="min-w-0 flex-1">
        <span class="flex flex-wrap items-center gap-x-2 gap-y-1">
          <span class="font-semibold text-ink">{{ integration.name }}</span>
          @if (settings(); as settings) {
          @if (integration.isConnected(settings)) {
          <span class="chip bg-success-50 text-success-800 ring-1 ring-success-200">Connected</span>
          } @else {
          <span class="chip bg-canvas text-ink-muted ring-1 ring-line">Using default</span>
          }
          }
        </span>
        <span class="mt-0.5 block text-sm text-ink-muted">{{ integration.description }}</span>
      </span>
      <svg class="size-5 shrink-0 text-ink-subtle" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
      </svg>
    </a>
  </li>
  }
</ul>
