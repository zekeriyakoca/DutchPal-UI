<div class="mx-auto max-w-4xl px-4 py-8 sm:px-6 sm:py-12">
  <div class="text-center">
    <h1 class="text-3xl font-semibold tracking-tight text-ink sm:text-4xl">Settings</h1>
  </div>

  @if (authService.user()) {
  <div class="mt-8 flex flex-col gap-6 sm:flex-row sm:gap-8">
    <nav aria-label="Settings" class="flex gap-1 sm:w-44 sm:shrink-0 sm:flex-col">
      <a routerLink="/settings" routerLinkActive="!bg-primary-50 !text-primary-700" [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        class="rounded-control px-3 py-2 text-sm font-medium text-ink-muted hover:bg-canvas hover:text-ink">General</a>
      <a routerLink="/settings/integrations" routerLinkActive="!bg-primary-50 !text-primary-700" ariaCurrentWhenActive="page"
        class="rounded-control px-3 py-2 text-sm font-medium text-ink-muted hover:bg-canvas hover:text-ink">Integrations</a>
    </nav>
    <div class="min-w-0 flex-1">
      <router-outlet />
    </div>
  </div>
  } @else if (authService.isLoaded()) {
  <div class="card mt-8">
    <div class="empty-state">
      <h2>You're not signed in</h2>
      <p>Sign in with Google to use your own settings.</p>
      @if (authService.isEnabled) {
      <div class="mt-3" appGoogleSignInButton></div>
      }
    </div>
  </div>
  }
</div>
