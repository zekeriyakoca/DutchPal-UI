<div class="w-full px-6 pb-3 pt-4 lg:px-8">
  <app-study-book-tabs></app-study-book-tabs>
</div>
<app-page-concept-sidebar class="w-full">
  <sidebar-menu>
    <div class="flex flex-col gap-4">
      <div class="text-left flex-1">
        <label for="book" class="block mb-1 text-sm font-normal text-gray-900">Select a book</label>
        <select id="book" [ngModel]="selectedBook" (ngModelChange)="selectBook($event)" name="book"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
          <option value="" disabled>Select a book</option>
          @for (book of books(); track book.book_id) {
          <option [value]="book.book_id">{{ book.title }}</option>
          }
        </select>
      </div>
      @if (selectedBook) {
      <div class="text-left flex-1">
        <label for="chapter" class="block mb-1 text-sm font-normal text-gray-900">Select a chapter</label>
        <select id="chapter" [ngModel]="selectedChapter" (ngModelChange)="selectChapter(+$event)" name="chapter"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
          <option [value]="0" disabled>Select a chapter</option>
          @for (item of chapters(); track item.id) {
          <option [value]="item.id">{{ item.number }}. {{ item.title }}</option>
          }
        </select>
      </div>
      }
    </div>
  </sidebar-menu>
  <master-content>
    @if (error()) {
    <div role="alert" class="mb-4 rounded-md border border-red-200 bg-red-50 p-3 text-left text-sm text-red-800">
      {{ error() }}
    </div>
    }
    <article class="max-w-3xl text-gray-900" [appSpinUntil]="isLoading()">
      @if (chapter(); as ch) {
      <app-chapter-view [chapter]="ch"></app-chapter-view>
      } @else if (!isLoading()) {
      <p class="text-gray-500">Select a book and a chapter.</p>
      }
    </article>
  </master-content>
</app-page-concept-sidebar>
